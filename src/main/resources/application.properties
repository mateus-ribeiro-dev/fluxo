spring.application.name=fluxo

spring.datasource.url=jdbc:h2:mem:fluxodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

fluxo.jwt-secret=${JWT_SECRET}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true

# Informações da aplicação
info.app.name=Fluxo API
info.app.description=Sistema de monitoramento de ocupacao das estacoes de metro
info.app.version=1.0.0
info.app.author=Mateus R. Azevedo